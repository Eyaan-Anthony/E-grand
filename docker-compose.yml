
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: esanta_postgres
    environment:
      POSTGRES_USER: esanta_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: esanta_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  redis:
    image: redis:alpine
    container_name: esanta_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: